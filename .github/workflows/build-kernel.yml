name: 🦍 Gorilla Unleashed — Kernel Build & Release

# When does this run?
# - On every push to main (so every time you upload new patches, it auto-builds)
# - Manually from the GitHub Actions tab ("Run workflow" button)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version to build (e.g. 7.1.2)'
        required: false
        default: '7.1.2'

jobs:
  build-kernel:
    name: Build Linux ${{ github.event.inputs.kernel_version || '7.1.2' }} Unleashed
    runs-on: ubuntu-latest

    # This gives the workflow permission to create a GitHub Release
    permissions:
      contents: write

    steps:

      # ── Step 1: Checkout the repository ──────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Install build dependencies ───────────────────────────────────
      - name: 📦 Install Kernel Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc git rsync curl xz-utils \
            kmod cpio dpkg-dev debhelper python3 \
            libdw-dev libzstd-dev dwarves zstd
          # libdw-dev is a HARD build-dep of bindeb-pkg and was missing, so
          # dpkg-checkbuilddeps aborted every single run at the compile step:
          #   "Unmet build dependencies: libdw-dev:native"
          # This repo has been advertising an auto-builder that never once
          # produced a package. dwarves(pahole)+libzstd/zstd are needed for BTF
          # generation and zstd-compressed packages respectively.
          echo "--- build-dep sanity ---"
          for p in libdw-dev libelf-dev libssl-dev dwarves; do
            dpkg -s "$p" >/dev/null 2>&1 && echo "  ok   $p" \
              || { echo "::error::$p failed to install"; exit 1; }
          done

      # ── Step 3: Download upstream kernel source ───────────────────────────────
      - name: 🌐 Download Linux Kernel Source
        run: |
          KERNEL_VER="${{ github.event.inputs.kernel_version || '7.1.2' }}"
          echo "Downloading linux-${KERNEL_VER}.tar.xz..."
          curl -L -o "linux-${KERNEL_VER}.tar.xz" \
            "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${KERNEL_VER}.tar.xz"
          tar -xf "linux-${KERNEL_VER}.tar.xz"

      # ── Step 3b: Prove the patch set still reproduces the shipped sources ────
      # Cheap, offline, and it fails the build BEFORE compiling for an hour if a
      # source file was edited without regenerating its patch.
      - name: 🔍 Verify patch set integrity
        run: |
          KERNEL_VER="${{ github.event.inputs.kernel_version || '7.1.2' }}"
          python3 make_patches.py --check
          TARBALL_PATH="./linux-${KERNEL_VER}.tar.xz" ./verify_patches.sh

      # ── Step 4: Apply the source patches ─────────────────────────────────────
      - name: 🩹 Apply Gorilla source patches
        run: |
          KERNEL_VER="${{ github.event.inputs.kernel_version || '7.1.2' }}"
          python3 universal_freedom_installer.py "./linux-${KERNEL_VER}"
          # Verify the artifact, never the exit code (project directive §2).
          n=$(grep -rl GORILLA "./linux-${KERNEL_VER}/net/wireless/reg.c" \
                 "./linux-${KERNEL_VER}/net/mac80211/mlme.c" \
                 "./linux-${KERNEL_VER}/drivers/net/wireless/ath/regd.c" | wc -l)
          [ "$n" -eq 3 ] || { echo "::error::patches did not land (only $n/3 marked files)"; exit 1; }
          echo "patched sources confirmed present"

      # ── Step 5: Apply custom kernel config ───────────────────────────────────
      # NOTE: the injector is NOT optional. Without it CI produced a DIFFERENT
      # kernel from every local build -- no EROFS, no forensics flags, nandsim
      # built in, no CFG80211_REG_RELAX_NO_IR. A CI artifact that silently
      # disagrees with the documented build is worse than no CI artifact.
      - name: ⚙️ Apply custom kernel configuration + audited change-set
        run: |
          KERNEL_VER="${{ github.event.inputs.kernel_version || '7.1.2' }}"
          cp kernel.config "linux-${KERNEL_VER}/.config"
          python3 kernel_config_injector.py "./linux-${KERNEL_VER}"
          make -C "linux-${KERNEL_VER}" olddefconfig
          # Spot-check that the change-set survived olddefconfig.
          for f in CONFIG_EROFS_FS=y CONFIG_IKCONFIG_PROC=y CONFIG_CFG80211_REG_RELAX_NO_IR=y; do
            grep -q "^$f" "linux-${KERNEL_VER}/.config" \
              || { echo "::error::$f missing after olddefconfig"; exit 1; }
          done
          echo "config change-set verified in .config"

      # ── Step 6: Compile the kernel ───────────────────────────────────────────
      - name: 🔥 Compile Kernel (Multi-threaded)
        run: |
          KERNEL_VER="${{ github.event.inputs.kernel_version || '7.1.2' }}"
          # Name via the 64-char-guarded namer, NOT a hand-written string. The
          # old hardcoded name still said "+60db" -- the King Kong audio hack that
          # was replaced by the EAPD fixup in June -- so every CI artifact was
          # advertising a feature the kernel had not contained for months.
          # Fewer tags than a local build on purpose: the full set lands at
          # exactly 64/64 chars, and a name with zero headroom breaks the moment
          # anyone adds a tag or the timestamp format shifts. 51/64 leaves room.
          LVERSION=$(python3 kernel_build_namer.py localversion \
                       --base "${KERNEL_VER}" \
                       --tags unleashed gorilla eapd bbr ci)
          echo "LOCALVERSION: ${LVERSION}"
          cd "linux-${KERNEL_VER}"
          # -O3 only: CI runners are not the target CPU, so -march=native here
          # would produce binaries tuned for whatever hardware GitHub allocated.
          export KCFLAGS="-O3 -pipe"
          make LOCALVERSION="${LVERSION}" -j$(nproc) bindeb-pkg KDEB_PKGVERSION="${KERNEL_VER}"

      # ── Step 7: Collect build output .deb packages ───────────────────────────
      - name: 📦 Collect Debian Packages
        run: |
          mkdir -p release-artifacts
          mv ../*.deb release-artifacts/ 2>/dev/null || mv *.deb release-artifacts/ 2>/dev/null || true
          ls -lah release-artifacts/

      # ── Step 8: Upload packages as GitHub Release ────────────────────────────
      - name: 🚀 Create GitHub Release with .deb Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.kernel_version || '7.1.2' }}-unleashed-${{ github.run_number }}"
          name: "🦍 Linux ${{ github.event.inputs.kernel_version || '7.1.2' }} Unleashed — Build #${{ github.run_number }}"
          body: |
            ## 🦍 Gorilla Unleashed Kernel Build

            Auto-built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            ### Install instructions:
            Download the two `.deb` files below and run:
            ```bash
            sudo dpkg -i linux-headers-*.deb linux-image-*.deb
            sudo reboot
            ```

            ### What's included:
            - Wi-Fi regulatory bypass (max TX power, no channel throttling)
            - HT40 CCA override (maintains 40MHz width in noisy environments)
            - TCP CWND scaled to 128 (fast-start for multi-gigabit links)
            - TCP memory buffers raised to 1GB
            - ALC269 audio latency fix (no more codec interrupt spikes)
            - BBR + FQ-Codel congestion control enabled
          files: release-artifacts/*.deb
          draft: false
          prerelease: false
